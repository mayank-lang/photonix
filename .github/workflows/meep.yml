name: Meep backend

# Meep/MPB is conda-only, so the FDTD backend is exercised in its own nightly
# job instead of the pip-based matrix. The job fails if any Meep test skips:
# a skip here means the backend was not actually tested.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "src/photonix/em/meep/**"
      - "tests/test_em_meep.py"
      - "tests/test_meep_multiport.py"
      - ".github/workflows/meep.yml"

permissions:
  contents: read

concurrency:
  group: meep-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  meep:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: photonix-meep
          create-args: >-
            python=3.11
            pymeep
            numpy
            scipy
            pytest
          init-shell: bash
          cache-environment: true
      - name: Install photonix
        run: python -m pip install -e ".[test]"
      - name: Meep backend tests (no skips allowed)
        run: |
          python -c "import meep, photonix; print('meep', meep.__version__)"
          python -m pytest tests/test_em_meep.py tests/test_meep_multiport.py -rs --junitxml=meep-junit.xml
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          root = ET.parse("meep-junit.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          tests = sum(int(s.get("tests", 0)) for s in suites)
          print(f"{tests} Meep tests, {skipped} skipped")
          raise SystemExit(1 if skipped or not tests else 0)
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meep-junit
          path: meep-junit.xml
          if-no-files-found: ignore
