name: Docs

# Builds the Sphinx site with warnings as errors on every PR and push. Pushes
# to main deploy it to GitHub Pages (Settings -> Pages -> Source: GitHub
# Actions). A weekly run also checks external links.
on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "7 6 * * 1"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  MPLBACKEND: Agg

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[docs,jax,layout,viz]"
      - name: Build HTML (warnings are errors)
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - name: API reference covers every public name
        run: python -m pytest tests/test_docs_coverage.py -rs
      - name: Check external links (weekly)
        if: github.event_name == 'schedule'
        run: python -m sphinx -b linkcheck docs docs/_build/linkcheck
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: docs/_build/html
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: docs-html-preview
          path: docs/_build/html
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
