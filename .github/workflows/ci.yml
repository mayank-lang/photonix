name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests benchmarks examples

      - name: Type check (mypy)
        if: matrix.python-version == '3.12'
        run: mypy src/photonix

      - name: Test (pytest)
        run: pytest tests -q

      # Docstring examples are part of the public API contract. They were not
      # executed before, and five of them had silently rotted.
      - name: Doctests
        run: pytest --doctest-modules src/photonix -q --ignore=src/photonix/em/meep

      # The examples are the package's front door; a broken one is a broken
      # release. Run them headless and fail on any traceback.
      - name: Examples
        env:
          MPLBACKEND: Agg
        run: |
          for f in examples/*.py; do
            case "$(basename "$f")" in _*) continue;; esac
            echo "--- $f"
            python "$f"
          done

      - name: Benchmark smoke (photonix-only, no external solvers)
        run: python benchmarks/run.py

  lint-only-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src tests

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and inspect distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[release]"
          python -m build
          python -m twine check dist/*
      - name: Test the built wheel in isolation
        run: |
          python -m venv wheel-test
          wheel-test/bin/python -m pip install dist/*.whl
          wheel-test/bin/python -m photonix info --json
